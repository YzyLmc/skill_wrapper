? !Skill
  name: Stack
  params: []
  semantics:
    pickupable: The second object to be underneath the first one.
    robot: robot that executes the stack skill.
  types:
  - robot
  - pickupable
  - pickupable
: - "(:action Stack_36 \n:parameters ( ?pickupable_p2 - pickupable  ?pickupable_p3\
    \ - pickupable  ?robot_p0 - robot )\n:precondition (and \n\t(not (= ?pickupable_p2\
    \ ?pickupable_p3))\n\t(clear ?pickupable_p3 )\n\t(has_item ?robot_p0 ?pickupable_p2)\n\
    \t(not (atop ?pickupable_p2 ?pickupable_p3))\n\t(not (nothing ?robot_p0 ))\n)\
    \ \n:effect (and \n \t(atop ?pickupable_p2 ?pickupable_p3) \n\t(clear ?pickupable_p2\
    \ ) \n\t(nothing ?robot_p0 ) \n\t(not (clear ?pickupable_p3 ))\n\t(not (has_item\
    \ ?robot_p0 ?pickupable_p2))\n ) \n)\n"
