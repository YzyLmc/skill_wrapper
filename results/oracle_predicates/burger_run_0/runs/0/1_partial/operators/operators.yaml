? !Skill
  name: Pick
  params: []
  semantics:
    pickupable: the object to be picked up.
    robot: robot that executes the pick skill.
  types:
  - robot
  - pickupable
: - "(:action Pick_35 \n:parameters ( ?pickupable_p2 - pickupable  ?robot_p0 - robot\
    \ )\n:precondition (and \n\t(clear ?pickupable_p2 )\n\t(nothing ?robot_p0 )\n\t\
    (not (has_item ?robot_p0 ?pickupable_p2))\n) \n:effect (and \n \t(has_item ?robot_p0\
    \ ?pickupable_p2) \n\t(not (clear ?pickupable_p2 ))\n\t(not (nothing ?robot_p0\
    \ ))\n ) \n)\n"
