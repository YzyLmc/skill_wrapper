? !Skill
  name: Pick
  params: []
  semantics:
    pickupable: the object to be picked up.
    robot: robot that executes the pick skill.
  types:
  - robot
  - pickupable
: - "(:action Pick_120 \n:parameters ( ?pickupable_p0 - pickupable  ?pickupable_p1\
    \ - pickupable  ?robot_p2 - robot )\n:precondition (and \n\t(not (= ?pickupable_p0\
    \ ?pickupable_p1))\n\t(clear ?pickupable_p1 )\n\t(nothing ?robot_p2 )\n\t(not\
    \ (has_item ?robot_p2 ?pickupable_p0))\n\t(not (has_item ?robot_p2 ?pickupable_p1))\n\
    ) \n:effect (and \n \t(has_item ?robot_p2 ?pickupable_p1) \n\t(not (clear ?pickupable_p1\
    \ ))\n\t(not (nothing ?robot_p2 ))\n ) \n)\n"
  - "(:action Pick_121 \n:parameters ( ?pickupable_p1 - pickupable  ?pickupable_p4\
    \ - pickupable  ?pickupable_p5 - pickupable  ?robot_p2 - robot )\n:precondition\
    \ (and \n\t(not (= ?pickupable_p1 ?pickupable_p4))\n\t(not (= ?pickupable_p1 ?pickupable_p5))\n\
    \t(not (= ?pickupable_p4 ?pickupable_p5))\n\t(atop ?pickupable_p1 ?pickupable_p5)\n\
    \t(nothing ?robot_p2 )\n\t(not (clear ?pickupable_p5 ))\n\t(not (has_item ?robot_p2\
    \ ?pickupable_p1))\n\t(not (has_item ?robot_p2 ?pickupable_p4))\n\t(not (has_item\
    \ ?robot_p2 ?pickupable_p5))\n) \n:effect (and \n \t(clear ?pickupable_p5 ) \n\
    \t(has_item ?robot_p2 ?pickupable_p1) \n\t(not (atop ?pickupable_p1 ?pickupable_p5))\n\
    \t(not (clear ?pickupable_p1 ))\n\t(not (nothing ?robot_p2 ))\n ) \n)\n"
  - "(:action Pick_122 \n:parameters ( ?pickupable_p0 - pickupable  ?pickupable_p1\
    \ - pickupable  ?pickupable_p4 - pickupable  ?pickupable_p5 - pickupable  ?robot_p2\
    \ - robot  ?station_p3 - station )\n:precondition (and \n\t(not (= ?pickupable_p0\
    \ ?pickupable_p1))\n\t(not (= ?pickupable_p0 ?pickupable_p4))\n\t(not (= ?pickupable_p0\
    \ ?pickupable_p5))\n\t(not (= ?pickupable_p1 ?pickupable_p4))\n\t(not (= ?pickupable_p1\
    \ ?pickupable_p5))\n\t(not (= ?pickupable_p4 ?pickupable_p5))\n\t(clear ?pickupable_p5\
    \ )\n\t(item_on ?pickupable_p5 ?station_p3)\n\t(nothing ?robot_p2 )\n\t(not (atop\
    \ ?pickupable_p1 ?pickupable_p5))\n\t(not (has_item ?robot_p2 ?pickupable_p0))\n\
    \t(not (has_item ?robot_p2 ?pickupable_p1))\n\t(not (has_item ?robot_p2 ?pickupable_p4))\n\
    \t(not (has_item ?robot_p2 ?pickupable_p5))\n\t(not (item_on ?pickupable_p1 ?station_p3))\n\
    \t(not (station_empty ?station_p3 ))\n) \n:effect (and \n \t(has_item ?robot_p2\
    \ ?pickupable_p5) \n\t(station_empty ?station_p3 ) \n\t(not (clear ?pickupable_p5\
    \ ))\n\t(not (item_on ?pickupable_p5 ?station_p3))\n\t(not (nothing ?robot_p2\
    \ ))\n ) \n)\n"
? !Skill
  name: Place
  params: []
  semantics:
    pickupable: the object to be dropped.
    robot: robot that executes the place skill.
    station: the receptacle onto which object is dropped.
  types:
  - robot
  - pickupable
  - station
: - "(:action Place_123 \n:parameters ( ?pickupable_p1 - pickupable  ?pickupable_p5\
    \ - pickupable  ?robot_p2 - robot  ?station_p3 - station )\n:precondition (and\
    \ \n\t(not (= ?pickupable_p1 ?pickupable_p5))\n\t(has_item ?robot_p2 ?pickupable_p1)\n\
    \t(station_empty ?station_p3 )\n\t(not (clear ?pickupable_p1 ))\n\t(not (has_item\
    \ ?robot_p2 ?pickupable_p5))\n\t(not (item_on ?pickupable_p1 ?station_p3))\n\t\
    (not (nothing ?robot_p2 ))\n) \n:effect (and \n \t(clear ?pickupable_p1 ) \n\t\
    (item_on ?pickupable_p1 ?station_p3) \n\t(nothing ?robot_p2 ) \n\t(not (has_item\
    \ ?robot_p2 ?pickupable_p1))\n\t(not (station_empty ?station_p3 ))\n ) \n)\n"
? !Skill
  name: Stack
  params: []
  semantics:
    pickupable: The second object to be underneath the first one.
    robot: robot that executes the stack skill.
  types:
  - robot
  - pickupable
  - pickupable
: - "(:action Stack_124 \n:parameters ( ?pickupable_p1 - pickupable  ?pickupable_p5\
    \ - pickupable  ?robot_p2 - robot  ?station_p3 - station )\n:precondition (and\
    \ \n\t(not (= ?pickupable_p1 ?pickupable_p5))\n\t(has_item ?robot_p2 ?pickupable_p1)\n\
    \t(not (atop ?pickupable_p1 ?pickupable_p5))\n\t(not (clear ?pickupable_p1 ))\n\
    \t(not (has_item ?robot_p2 ?pickupable_p5))\n\t(not (iscooked ?pickupable_p1 ))\n\
    \t(not (item_on ?pickupable_p1 ?station_p3))\n\t(not (nothing ?robot_p2 ))\n)\
    \ \n:effect (and \n \t(atop ?pickupable_p1 ?pickupable_p5) \n\t(clear ?pickupable_p1\
    \ ) \n\t(nothing ?robot_p2 ) \n\t(not (clear ?pickupable_p5 ))\n\t(not (has_item\
    \ ?robot_p2 ?pickupable_p1))\n ) \n)\n"
