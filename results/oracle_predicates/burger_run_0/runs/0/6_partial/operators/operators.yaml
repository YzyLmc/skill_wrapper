? !Skill
  name: Pick
  params: []
  semantics:
    pickupable: the object to be picked up.
    robot: robot that executes the pick skill.
  types:
  - robot
  - pickupable
: - "(:action Pick_103 \n:parameters ( ?pickupable_p1 - pickupable  ?pickupable_p2\
    \ - pickupable  ?robot_p5 - robot )\n:precondition (and \n\t(not (= ?pickupable_p1\
    \ ?pickupable_p2))\n\t(clear ?pickupable_p2 )\n\t(nothing ?robot_p5 )\n\t(not\
    \ (has_item ?robot_p5 ?pickupable_p1))\n\t(not (has_item ?robot_p5 ?pickupable_p2))\n\
    ) \n:effect (and \n \t(has_item ?robot_p5 ?pickupable_p2) \n\t(not (clear ?pickupable_p2\
    \ ))\n\t(not (nothing ?robot_p5 ))\n ) \n)\n"
  - "(:action Pick_104 \n:parameters ( ?pickupable_p0 - pickupable  ?pickupable_p2\
    \ - pickupable  ?pickupable_p3 - pickupable  ?robot_p5 - robot )\n:precondition\
    \ (and \n\t(not (= ?pickupable_p0 ?pickupable_p2))\n\t(not (= ?pickupable_p0 ?pickupable_p3))\n\
    \t(not (= ?pickupable_p2 ?pickupable_p3))\n\t(atop ?pickupable_p2 ?pickupable_p0)\n\
    \t(nothing ?robot_p5 )\n\t(not (atop ?pickupable_p3 ?pickupable_p2))\n\t(not (clear\
    \ ?pickupable_p0 ))\n\t(not (has_item ?robot_p5 ?pickupable_p0))\n\t(not (has_item\
    \ ?robot_p5 ?pickupable_p2))\n\t(not (has_item ?robot_p5 ?pickupable_p3))\n) \n\
    :effect (and \n \t(clear ?pickupable_p0 ) \n\t(has_item ?robot_p5 ?pickupable_p2)\
    \ \n\t(not (atop ?pickupable_p2 ?pickupable_p0))\n\t(not (clear ?pickupable_p2\
    \ ))\n\t(not (nothing ?robot_p5 ))\n ) \n)\n"
? !Skill
  name: Place
  params: []
  semantics:
    pickupable: the object to be dropped.
    robot: robot that executes the place skill.
    station: the receptacle onto which object is dropped.
  types:
  - robot
  - pickupable
  - station
: - "(:action Place_105 \n:parameters ( ?pickupable_p0 - pickupable  ?pickupable_p2\
    \ - pickupable  ?robot_p5 - robot  ?station_p4 - station )\n:precondition (and\
    \ \n\t(not (= ?pickupable_p0 ?pickupable_p2))\n\t(has_item ?robot_p5 ?pickupable_p2)\n\
    \t(station_empty ?station_p4 )\n\t(not (clear ?pickupable_p2 ))\n\t(not (has_item\
    \ ?robot_p5 ?pickupable_p0))\n\t(not (item_on ?pickupable_p2 ?station_p4))\n\t\
    (not (nothing ?robot_p5 ))\n) \n:effect (and \n \t(clear ?pickupable_p2 ) \n\t\
    (item_on ?pickupable_p2 ?station_p4) \n\t(nothing ?robot_p5 ) \n\t(not (has_item\
    \ ?robot_p5 ?pickupable_p2))\n\t(not (station_empty ?station_p4 ))\n ) \n)\n"
