    \ )\n\t(item_on ?pickupable_p1 ?station_p0)\n\t(nothing ?robot_p5 )\n\t(not (atop\
    \ ?pickupable_p1 ?pickupable_p3))\n\t(not (has_item ?robot_p5 ?pickupable_p0))\n\
    \t(not (has_item ?robot_p5 ?pickupable_p1))\n\t(not (has_item ?robot_p5 ?pickupable_p2))\n\
    \t(not (iscut ?pickupable_p1 ))\n) \n:effect (and \n \t(iscut ?pickupable_p1 )\
