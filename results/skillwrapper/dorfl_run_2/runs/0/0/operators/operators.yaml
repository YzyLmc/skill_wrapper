? !Skill
  name: LeftArmPick
  params: []
  semantics:
    openable: the openable object to be picked up.
    robot: the robot that performs the pick action with its left arm.
  types:
  - robot
  - openable
: - "(:action LeftArmPick_54 \n:parameters ( ?openable_p1 - openable  ?robot_p0 -\
    \ robot )\n:precondition (and \n\t(not (InLeftGripper ?robot_p0 ?openable_p1))\n\
    \t(not (LidOff ?openable_p1 ))\n) \n:effect (and \n \t(InLeftGripper ?robot_p0\
    \ ?openable_p1) \n ) \n)\n"
