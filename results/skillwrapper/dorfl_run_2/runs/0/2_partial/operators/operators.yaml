? !Skill
  name: LeftArmPick
  params: []
  semantics:
    openable: the openable object to be picked up.
    robot: the robot that performs the pick action with its left arm.
  types:
  - robot
  - openable
: - "(:action LeftArmPick_167 \n:parameters ( ?openable_p1 - openable  ?robot_p0 -\
    \ robot )\n:precondition (and \n\t(Closed ?openable_p1 )\n\t(LeftGripperEmpty\
    \ ?robot_p0 )\n\t(OpenableOnTable ?openable_p1 )\n\t(not (InLeftGripper ?robot_p0\
    \ ?openable_p1))\n\t(not (LidOff ?openable_p1 ))\n) \n:effect (and \n  ) \n)\n"
? !Skill
  name: RightArmPick
  params: []
  semantics:
    robot: the robot that performs the pick action with its right arm.
    utensil: the utensil to be picked up.
  types:
  - robot
  - utensil
: - "(:action RightArmPick_168 \n:parameters ( ?robot_p0 - robot  ?utensil_p0 - utensil\
    \ )\n:precondition (and \n\t(InContainer ?utensil_p0 )\n\t(RightGripperEmpty ?robot_p0\
    \ )\n\t(not (Coated ?utensil_p0 ))\n\t(not (InRightGripper ?robot_p0 ?utensil_p0))\n\
    \t(not (UtensilOnTable ?utensil_p0 ))\n) \n:effect (and \n  ) \n)\n"
