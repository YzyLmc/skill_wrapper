- !Predicate
  name: InLeftGripper
  params: !!python/tuple []
  semantic: "the openable object is currently grasped by the robot\u2019s left gripper,\
    \ with the gripper fingers in contact enclosing the object."
  types: !!python/tuple
  - robot
  - openable
- !Predicate
  name: InRightGripper
  params: !!python/tuple []
  semantic: "the utensil is physically\
    \ enclosed and held by the robot\u2019s right gripper, with the gripper fingers\
    \ in contact around the utensil."
  types: !!python/tuple
  - robot
  - utensil
- !Predicate
  name: RightGripperEmpty
  params: !!python/tuple []
  semantic: "the robot\u2019s right gripper is visibly not holding anything\u2014\
    the fingers are not enclosing or contacting any part of the utensil, and the grasping\
    \ space is empty."
  types: !!python/tuple
  - robot
- !Predicate
  name: LidOff
  params: !!python/tuple []
  semantic: "the openable object\u2019s lid/cover is not attached; its opening is\
    \ exposed and the interior is visible."
  types: !!python/tuple
  - openable
