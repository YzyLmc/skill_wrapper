2025-9-22-15-24-41:
  0: !PredicateState
    predicates:
    - predicate: !Predicate
        name: InLeftGripper
        params: &id001 !!python/tuple
        - Robot
        - PeanutButterJar
        semantic: the openable object is currently grasped by the robot's left gripper,
          with the gripper fingers in contact enclosing the object.
        types: &id002 !!python/tuple
        - robot
        - openable
      truth_value: false
    - predicate: !Predicate
        name: InRightGripper
        params: &id003 !!python/tuple
        - Robot
        - Knife
        semantic: the utensil is physically enclosed and held by the robot's right
          gripper, with the gripper fingers in contact around the utensil.
        types: &id004 !!python/tuple
        - robot
        - utensil
      truth_value: false
    - predicate: !Predicate
        name: RightGripperEmpty
        params: &id005 !!python/tuple
        - Robot
        semantic: the robot's right gripper is visibly not holding anything.the fingers
          are not enclosing or contacting any part of the utensil, and the grasping
          space is empty.
        types: &id006 !!python/tuple
        - robot
      truth_value: true
    - predicate: !Predicate
        name: LidOff
        params: &id007 !!python/tuple
        - PeanutButterJar
        semantic: the openable object's lid/cover is not attached; its opening is
          exposed and the interior is visible.
        types: &id008 !!python/tuple
        - openable
      truth_value: false
    - predicate: !Predicate
        name: LeftGripperEmpty
        params: &id009 !!python/tuple
        - Robot
        semantic: "the robot's left gripper is visibly not holding any object\u2014\
          the fingers are not enclosing or contacting anything and the grasping space\
          \ is clear."
        types: &id010 !!python/tuple
        - robot
      truth_value: true
    - predicate: !Predicate
        name: InContainer
        params: &id011 !!python/tuple
        - Knife
        semantic: the utensil is located within another object's interior volume,
          with part of it below that object's rim and laterally enclosed by its walls.
        types: &id012 !!python/tuple
        - utensil
      truth_value: true
    - predicate: !Predicate
        name: OpenableOnTable
        params: &id013 !!python/tuple
        - PeanutButterJar
        semantic: the openable object's base is in contact with and supported from
          below by the tabletop (resting stably on the surface).
        types: &id014 !!python/tuple
        - openable
      truth_value: true
    - predicate: !Predicate
        name: UtensilOnTable
        params: &id015 !!python/tuple
        - Knife
        semantic: the utensil is resting on and supported by the tabletop, with part
          of it visibly contacting the table surface (i.e., not enclosed within another
          object).
        types: &id016 !!python/tuple
        - utensil
      truth_value: false
    - predicate: !Predicate
        name: Closed
        params: &id017 !!python/tuple
        - PeanutButterJar
        semantic: the openable's lid is visibly attached and covering its opening;
          the interior is not visible.
        types: &id018 !!python/tuple
        - openable
      truth_value: true
    - predicate: !Predicate
        name: Coated
        params: &id019 !!python/tuple
        - Knife
        semantic: a visible layer or clump of material adheres to the utensil's working
          end (e.g., the blade shows a smear that was absent before).
        types: &id020 !!python/tuple
        - utensil
      truth_value: false
    - predicate: !Predicate
        name: SpreadOn
        params: &id021 !!python/tuple
        - Bread
        semantic: the food's top surface shows a visible layer or patch of spread
          material (e.g., a smear) on it.
        types: &id022 !!python/tuple
        - food
      truth_value: false
    - predicate: !Predicate
        name: HeldByRobot
        params: &id023 !!python/tuple
        - Robot
        - PeanutButterJar
        semantic: "the openable object is currently enclosed and held by any of the\
          \ robot\u2019s grippers (left or right), with the gripper fingers in contact\
          \ around the object."
        types: &id024 !!python/tuple
        - robot
        - openable
      truth_value: false
