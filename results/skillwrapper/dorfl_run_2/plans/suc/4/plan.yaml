      - robot
      - utensil
    - !Skill
      name: Drop
      params:
      - robot
      - knife
      semantics: *id001
      types:
      - robot
      - utensil
  all_plans:
  - - (leftarmpick_1 peanutbutterjar robot)
    - (rightarmpick_2 robot knife)
    - (drop_3 robot knife)
