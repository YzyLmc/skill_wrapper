- !Predicate
  name: gripper_empty
  params: !!python/tuple []
  semantic: "the robot\u2019s gripper holds no pickupable object (no pickupable is\
    \ attached to or overlapping the robot\u2019s hand)."
  types: !!python/tuple
  - robot
- !Predicate
  name: holding
  params: !!python/tuple []
  semantic: "the pickupable visually overlaps the robot\u2019s gripper, indicating\
    \ the robot is holding that pickupable."
  types: !!python/tuple
  - robot
  - pickupable
- !Predicate
  name: stacked_on
  params: !!python/tuple []
  semantic: the first pickupable visually overlaps and occludes the second pickupable
    such that the second lies underneath, indicating the first is resting on the second.
  types: !!python/tuple
  - pickupable
  - pickupable
- !Predicate
  name: on_cutting_board
  params: !!python/tuple []
  semantic: the cuttable visually overlaps and occludes the cutting board surface
    so that the board lies underneath the cuttable.
  types: !!python/tuple
  - cuttable
- !Predicate
  name: cut_into_pieces
  params: !!python/tuple []
  semantic: the cuttable appears as at least two non-touching visible pieces (its
    mask has multiple disconnected regions), indicating it is cut rather than a single
    intact piece.
  types: !!python/tuple
  - cuttable
- !Predicate
  name: top_most
  params: !!python/tuple []
  semantic: the target pickupable is the topmost item in its stack on the ground or 
    a surface for a robot to pick up (nothing rests on it).
  types: !!python/tuple
  - pickupable
- !Predicate
  name: station_unoccupied
  params: !!python/tuple []
  semantic: "no pickupable visually overlaps or occludes the station\u2019s top surface;\
    \ nothing is resting on the station."
  types: !!python/tuple
  - station
- !Predicate
  name: on_station
  params: !!python/tuple []
  semantic: "the pickupable visually overlaps and occludes the station\u2019s top\
    \ surface so that the station lies underneath the pickupable, indicating the pickupable\
    \ is resting on that station."
  types: !!python/tuple
  - pickupable
  - station
- !Predicate
  name: cooked
  params: !!python/tuple []
  semantic: "the cookable\u2019s surface appears browned/darkened with visible sear\
    \ or grill marks (not raw-pink), indicating it is in a cooked state."
  types: !!python/tuple
  - cookable
