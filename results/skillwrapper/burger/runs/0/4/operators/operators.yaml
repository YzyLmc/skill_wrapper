    \ ) \n\t(not (holding ?robot_p5 ?cuttable_p0))\n\t(not (station_unoccupied ?station_p4\
    \ ))\n ) \n)\n"
  - "(:action Place_5 \n:parameters ( ?pickupable_p0 - pickupable  ?pickupable_p2\
    \ - pickupable  ?robot_p5 - robot  ?station_p3 - station )\n:precondition (and\
    \ \n\t(not (= ?pickupable_p0 ?pickupable_p2))\n\t(holding ?robot_p5 ?pickupable_p2)\n\
    \t(station_unoccupied ?station_p3 )\n\t(not (gripper_empty ?robot_p5 ))\n\t(not\
