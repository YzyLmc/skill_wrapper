    \  ?pickupable_p2 - pickupable  ?pickupable_p6 - pickupable  ?robot_p5 - robot\
    \  ?station_p4 - station )\n:precondition (and \n\t(not (= ?pickupable_p1 ?pickupable_p2))\n\
    \t(not (= ?pickupable_p1 ?pickupable_p6))\n\t(not (= ?pickupable_p2 ?pickupable_p6))\n\
    \t(holding ?robot_p5 ?cuttable_p0)\n\t(station_unoccupied ?station_p4 )\n\t(not\
    \ (cut_into_pieces ?cuttable_p0 ))\n\t(not (gripper_empty ?robot_p5 ))\n\t(not\
    \ (holding ?robot_p5 ?pickupable_p1))\n\t(not (holding ?robot_p5 ?pickupable_p2))\n\
    \t(not (holding ?robot_p5 ?pickupable_p6))\n\t(not (on_cutting_board ?cuttable_p0\
    \ ))\n\t(not (on_station ?cuttable_p0 ?station_p4))\n\t(not (on_station ?pickupable_p1\
    \ ?station_p4))\n\t(not (stacked_on ?pickupable_p6 ?cuttable_p0))\n\t(not (top_most\
