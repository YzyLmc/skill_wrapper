    \t(not (top_most ?pickupable_p2 ))\n) \n:effect (and \n \t(gripper_empty ?robot_p5\
    \ ) \n\t(on_station ?pickupable_p2 ?station_p3) \n\t(top_most ?pickupable_p2 )\
