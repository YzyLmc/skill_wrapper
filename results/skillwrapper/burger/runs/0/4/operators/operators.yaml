? !Skill
  name: Pick
  params: []
  semantics:
    pickupable: the object to be picked up.
    robot: robot that executes the pick skill.
  types:
  - robot
  - pickupable
: - "(:action Pick_1 \n:parameters ( ?pickupable_p0 - pickupable  ?pickupable_p1 -\
    \ pickupable  ?pickupable_p6 - pickupable  ?robot_p5 - robot )\n:precondition\
    \ (and \n\t(not (= ?pickupable_p0 ?pickupable_p1))\n\t(not (= ?pickupable_p0 ?pickupable_p6))\n\
    \t(not (= ?pickupable_p1 ?pickupable_p6))\n\t(gripper_empty ?robot_p5 )\n\t(stacked_on\
    \ ?pickupable_p0 ?pickupable_p6)\n\t(top_most ?pickupable_p0 )\n\t(not (holding\
    \ ?robot_p5 ?pickupable_p0))\n\t(not (holding ?robot_p5 ?pickupable_p1))\n\t(not\
    \ (holding ?robot_p5 ?pickupable_p6))\n\t(not (stacked_on ?pickupable_p6 ?pickupable_p1))\n\
    ) \n:effect (and \n \t(holding ?robot_p5 ?pickupable_p0) \n\t(top_most ?pickupable_p6\
    \ ) \n\t(not (gripper_empty ?robot_p5 ))\n\t(not (stacked_on ?pickupable_p0 ?pickupable_p6))\n\
    \t(not (top_most ?pickupable_p0 ))\n ) \n)\n"
  - "(:action Pick_2 \n:parameters ( ?pickupable_p0 - pickupable  ?robot_p5 - robot\
    \ )\n:precondition (and \n\t(gripper_empty ?robot_p5 )\n\t(top_most ?pickupable_p0\
    \ )\n\t(not (holding ?robot_p5 ?pickupable_p0))\n) \n:effect (and \n \t(holding\
    \ ?robot_p5 ?pickupable_p0) \n\t(not (gripper_empty ?robot_p5 ))\n\t(not (top_most\
    \ ?pickupable_p0 ))\n ) \n)\n"
  - "(:action Pick_3 \n:parameters ( ?pickupable_p0 - pickupable  ?pickupable_p1 -\
    \ pickupable  ?pickupable_p2 - pickupable  ?pickupable_p6 - pickupable  ?robot_p5\
    \ - robot  ?station_p3 - station )\n:precondition (and \n\t(not (= ?pickupable_p0\
    \ ?pickupable_p1))\n\t(not (= ?pickupable_p0 ?pickupable_p2))\n\t(not (= ?pickupable_p0\
    \ ?pickupable_p6))\n\t(not (= ?pickupable_p1 ?pickupable_p2))\n\t(not (= ?pickupable_p1\
    \ ?pickupable_p6))\n\t(not (= ?pickupable_p2 ?pickupable_p6))\n\t(gripper_empty\
    \ ?robot_p5 )\n\t(on_station ?pickupable_p6 ?station_p3)\n\t(top_most ?pickupable_p6\
    \ )\n\t(not (holding ?robot_p5 ?pickupable_p0))\n\t(not (holding ?robot_p5 ?pickupable_p2))\n\
    \t(not (holding ?robot_p5 ?pickupable_p6))\n\t(not (on_station ?pickupable_p1\
    \ ?station_p3))\n\t(not (stacked_on ?pickupable_p6 ?pickupable_p1))\n\t(not (station_unoccupied\
    \ ?station_p3 ))\n) \n:effect (and \n \t(holding ?robot_p5 ?pickupable_p6) \n\t\
    (station_unoccupied ?station_p3 ) \n\t(not (gripper_empty ?robot_p5 ))\n\t(not\
    \ (on_station ?pickupable_p6 ?station_p3))\n\t(not (top_most ?pickupable_p6 ))\n\
    \ ) \n)\n"
? !Skill
  name: Place
