env: dorfl
plan_method: fd
0:
  all_parsed_plans:
  - - !Skill
      name: Drop
      params:
      - Robot
      - Knife
      semantics: &id001 {}
      types:
      - robot
      - utensil
    - !Skill
      name: LeftArmPick
      params:
      - Robot
      - PeanutButterJar
      semantics: *id001
      types:
      - robot
      - openable
    - !Skill
      name: Open
      params:
      - Robot
      - PeanutButterJar
      semantics: *id001
      types:
      - robot
      - openable
  all_plans:
  - - (drop robot knife)
    - (leftarmpick robot peanutbutterjar)
    - (open robot peanutbutterjar)
