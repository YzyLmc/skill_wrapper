# This yaml file contains meta data for a test task.
---
env: burger

skills:
  Pick: !Skill
    name: Pick
    types:
      - pickupable
    params: !!python/tuple []
    semantics:
      pickupable: the object to be picked up.

  Place: !Skill
    name: Place
    types:
      - pickupable
      - location
    params: !!python/tuple []
    semantics:
      pickupable: the object to be dropped.
      location: the receptacle onto which object is dropped.

  Stack: !Skill
    name: Stack
    types:
      - pickupable
      - pickupable
    params: !!python/tuple []
    semantics:
      pickupable: The first object to put on the other.
      pickupable: The second object to be underneath the first one.

  Cut: !Skill
    name: Cut
    types:
      - cuttable
    params: !!python/tuple []
    semantics:
      cuttable: the object that is being cut.

  Cook: !Skill
    name: Cook
    types:
      - cookable
    params: !!python/tuple []
    semantics:
      cookable: the object that is being cooked.


objects:
  Robot:
   types:
      - robot
  Lettuce:
    types:
      - pickupable
      - cuttable
  TopBun:
    types:
      - pickupable
  BottomBun:
    types:
      - pickupable
  Patty:
    types:
      - pickupable
      - cookable
  Stove:
    types:
      - location
      - cooker
  Board:
    types:
      - location
      - cuttingboard

Env_description: 'There is a robot in the kitchen. The robot can pick up, place, stack, cut, and cook objects. The robot has access to lettuce, top bun, bottom bun, and patty. The stove and cutting board are available. The lettuce is uncut and the patty is raw. The robot can navigate the environment freely but only has one gripper.'

Initial_observation:
  img_fpath:
    - 'test_tasks/test_imgs/init_state/burger.png'