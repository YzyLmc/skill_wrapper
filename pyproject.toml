[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill_wrapper"
version = "0.1.0"
description = "Autonomously learning interpretable skill abstractions with foundation models"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "openai",
    "sentence-transformers",
]

[tool.uv]
dev-dependencies = ["ruff", "mypy", "typing-extensions"]

[tool.hatch.build.targets.wheel]
packages = ["src"] # Include packages at these paths
